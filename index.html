:root{--blue:#1F54C4;--blue-hover:#1A47A6;--blue-press:#163C8C;--grey:#6E758A;--line:#DFE1E5;--divider:#EDEEF1;--muted:#A6ACB9;--white:#FFFFFD;--ok:#0E7C55;--err:#C0342B;--ease:cubic-bezier(.32,.72,0,1);--enter:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--white);overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;color:var(--blue);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--blue);font-weight:500;text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}

.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--white)}
.frame{position:relative;flex-shrink:0;width:calc(390px * var(--s,1));height:calc(844px * var(--s,1));overflow:hidden;background:var(--white)}
.frame.is-framed{border-radius:calc(32px * var(--s,1));box-shadow:0 0 0 1px #EDEEF1,0 40px 80px -40px rgba(31,84,196,.28)}
.da{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;transform:scale(var(--s,1));display:flex;flex-direction:column;overflow:hidden;background:var(--white)}
.da-head{flex-shrink:0;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:14px;border-bottom:1px solid var(--divider)}
.da-head img{display:block;width:auto}
.stage{position:relative;flex:1 1 0;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.hero{position:relative;flex:1 1 0;min-height:120px}
.hero svg{position:absolute;left:20px;top:12px;width:calc(100% - 40px);height:calc(100% - 12px);overflow:visible}

.intro{flex-shrink:0;padding:8px 20px 0;display:flex;flex-direction:column;gap:8px}
.over{margin:0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.display{margin:0;font-family:Milling,-apple-system,BlinkMacSystemFont,sans-serif;font-weight:400;font-size:38px;line-height:1.04;letter-spacing:-.02em;color:var(--blue)}
.u{position:relative;display:inline-block}
.u svg{position:absolute;left:-2px;bottom:-9px;width:calc(100% + 6px);height:11px;overflow:visible}
.lede{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--grey)}
.points{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45;color:var(--grey)}
.points li{display:flex;align-items:center;gap:10px}
.points li::before{content:"";flex-shrink:0;width:6px;height:6px;border-radius:999px;background:var(--blue)}

form{flex:0 1 auto;min-height:0;overflow-y:auto;padding:20px 20px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.fields{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px}
.row .field{flex:1 1 0;min-width:0}
.row .field-age{flex:0 0 120px;gap:8px;padding:0 12px 0 16px}
#da-age{font-variant-numeric:tabular-nums}
.field{position:relative;flex-shrink:0;height:60px;border:1.5px solid var(--line);border-radius:14px;background:var(--white);display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;transition:border-color 140ms var(--ease),box-shadow 140ms var(--ease)}
.field .ico{flex-shrink:0;width:20px;height:20px;color:var(--grey);transition:color 140ms var(--ease)}
.slot{position:relative;flex:1;min-width:0;height:100%}
.slot input{position:absolute;inset:0;width:100%;height:100%;border:0;padding:22px 0 6px;background:transparent;font:inherit;font-size:17px;color:var(--blue);outline:none;border-radius:0;-webkit-appearance:none;appearance:none}
.slot input::placeholder{color:transparent}
.slot label{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:16px;font-weight:500;line-height:1.2;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:top 220ms var(--ease),transform 220ms var(--ease),font-size 220ms var(--ease),color 140ms var(--ease)}
.field.is-up .slot label{top:10px;transform:none;font-size:12px}
.field.is-focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,84,196,.14)}
.field.is-focus .ico,.field.is-focus .slot label{color:var(--blue)}
.field.is-focus .slot input::placeholder{color:var(--muted)}
.field.is-err{border-color:var(--err);box-shadow:0 0 0 4px rgba(192,52,43,.10)}
.field.is-err .ico,.field.is-err .slot label{color:var(--err)}
.prefix{position:absolute;left:0;top:22px;font-size:17px;line-height:27px;font-weight:500;color:var(--blue);opacity:0;transition:opacity 140ms var(--ease);pointer-events:none}
.field.is-up .prefix{opacity:1}
.field.is-up #da-phone{padding-left:40px}
#da-phone{letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mark{flex-shrink:0;width:20px;height:20px;display:none}
.field.is-ok .mark-ok{display:block;animation:pop 220ms var(--enter) both}
.field.is-err .mark-err{display:block;animation:pop 220ms var(--enter) both}

.opt{position:relative;flex-shrink:0;margin-top:16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;line-height:1.3;color:var(--grey)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.box{flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:var(--white);display:flex;align-items:center;justify-content:center;transition:background-color 140ms var(--ease),border-color 140ms var(--ease)}
.box svg{opacity:0;transform:scale(.6);transition:opacity 140ms var(--ease),transform 220ms var(--enter)}
.opt input:checked + .box{background:var(--blue);border-color:var(--blue)}
.opt input:checked + .box svg{opacity:1;transform:none}
.opt input:focus-visible + .box{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--blue)}

.cta{position:relative;overflow:hidden;flex-shrink:0;width:100%;height:64px;border:0;border-radius:20px;padding:0 9px 0 22px;background:var(--blue);color:var(--white);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-decoration:none !important;box-shadow:inset 0 1px 0 rgba(255,255,253,.22),0 16px 28px -14px rgba(31,84,196,.65),0 2px 6px rgba(31,84,196,.16);transition:background-color 140ms var(--ease),transform 80ms var(--ease)}
form .cta{margin-top:18px}
.cta:hover{background:var(--blue-hover)}
.cta:active{transform:scale(.985);background:var(--blue-press)}
.cta:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.cta[aria-busy="true"]{cursor:progress}
.cta-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.cta-title{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--white)}
.cta-sub{font-size:12px;font-weight:500;line-height:1.2;color:rgba(255,255,253,.74)}
.knob{position:relative;flex-shrink:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.knob .ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-fill{transition:stroke-dashoffset 420ms var(--ease)}
.knob-dot{width:38px;height:38px;border-radius:999px;background:var(--white);color:var(--blue);display:flex;align-items:center;justify-content:center}
.spinner{display:none}
.cta[aria-busy="true"] .arrow{display:none}
.cta[aria-busy="true"] .spinner{display:block;animation:spin .8s linear infinite}
.cta.is-ready .arrow,.cta-link .arrow{animation:nudge 1.1s var(--ease) infinite}
.sheen{position:absolute;top:0;bottom:0;left:0;width:56px;background:linear-gradient(90deg,rgba(255,255,253,0),rgba(255,255,253,.22),rgba(255,255,253,0));pointer-events:none;opacity:0}
.cta.is-ready .sheen,.cta-link .sheen{opacity:1;animation:sheen 2.8s var(--ease) infinite}
.fine{flex-shrink:0;margin:12px 0 0;text-align:center;font-size:12px;line-height:1.4;color:var(--grey)}

.done{flex:0 1 auto;min-height:0;overflow-y:auto;padding:14px 20px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.done .display{font-size:36px;line-height:1.06}
.done .display:focus{outline:none}
.ticket{position:relative;flex-shrink:0;border:1.5px solid var(--line);border-radius:20px;background:var(--white);padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(31,84,196,.06),0 18px 34px -18px rgba(31,84,196,.28)}
.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.code{font-size:26px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--blue);white-space:nowrap}
.copy{flex-shrink:0;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--blue);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background-color 140ms var(--ease)}
.copy:hover{background:rgba(31,84,196,.06)}
.copy:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.copy .i-done{display:none;color:var(--ok)}
.copy.is-copied .i-done{display:block;animation:pop 220ms var(--enter) both}
.copy.is-copied .i-copy{display:none}
.perf{position:relative;height:0;margin:2px 0;border-top:1.5px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:11px;height:20px;background:var(--white);border:1.5px solid var(--line)}
.perf::before{left:-21.5px;border-left:0;border-radius:0 10px 10px 0}
.perf::after{right:-21.5px;border-right:0;border-radius:10px 0 0 10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:17px;font-weight:700;color:var(--blue)}
.stats span{font-size:12px;color:var(--grey)}
.actions{flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--grey)}
.ghost{height:44px;margin-left:-10px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--blue);font-size:14px;font-weight:500;cursor:pointer}
.ghost:hover{background:rgba(31,84,196,.06)}
.ghost:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* motion */
@keyframes track{to{stroke-dashoffset:-36}}
@keyframes hurdle{0%{transform:translateX(390px)}100%{transform:translateX(-50px)}}
@keyframes jump{0%,43%{transform:translateY(0)}56%{transform:translateY(-42px)}69%,100%{transform:translateY(0)}}
@keyframes swing{0%{transform:rotate(34deg)}100%{transform:rotate(-34deg)}}
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-2.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-5px)}}
@keyframes twinkle{0%,100%{transform:scale(.55);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.8}100%{transform:translate(-20px,-7px) scale(1.5);opacity:0}}
@keyframes speed{0%{transform:translateX(8px);opacity:0}30%{opacity:.7}100%{transform:translateX(-16px);opacity:0}}
@keyframes tails{0%{transform:rotate(-8deg)}100%{transform:rotate(10deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes sheen{0%{transform:translateX(-140%) skewX(-18deg)}55%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes burst{from{transform:translate(var(--fx,0),var(--fy,0)) rotate(-120deg) scale(.3);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
@keyframes flutter{0%{transform:rotate(-5deg)}100%{transform:rotate(7deg)}}
@keyframes cheer{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
.m-track{animation:track .55s linear infinite}
.m-hurdle{animation:hurdle 3.2s linear infinite}
.m-jump{animation:jump 3.2s ease-in-out infinite}
.m-limb-a{animation:swing .42s ease-in-out infinite alternate}
.m-limb-b{animation:swing .42s ease-in-out infinite alternate-reverse}
.m-bob{animation:bob .21s ease-in-out infinite alternate}
.m-spin{animation:spin 4s linear infinite}
.m-float{animation:float 2.6s ease-in-out infinite alternate}
.m-twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.m-puff{transform-box:fill-box;transform-origin:center;animation:puff .6s ease-out infinite}
.m-speed{animation:speed .6s linear infinite}
.m-tails{animation:tails .3s ease-in-out infinite alternate}
.m-draw{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.1s var(--enter) .6s forwards}
.m-rise{animation:rise 520ms var(--enter) both}
.m-rise-2{animation:rise 520ms var(--enter) 90ms both}
.m-rise-3{animation:rise 520ms var(--enter) 180ms both}
.m-burst{transform-box:fill-box;transform-origin:center;animation:burst 900ms var(--enter) both}
.m-flutter{animation:flutter .7s ease-in-out infinite alternate}
.m-cheer{animation:cheer .5s ease-in-out infinite alternate}
@keyframes m-jump-px{0%,38%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.75,.4,1)}55%{transform:translateY(-46px);animation-timing-function:cubic-bezier(.6,0,.8,.25)}72%,100%{transform:translateY(0)}}
.m-jump-px{animation:m-jump-px 3.2s linear infinite}
@keyframes m-frame{0%{opacity:1}50%,100%{opacity:0}}
.m-fa{animation:m-frame .32s steps(1,end) infinite}
.m-fb{animation:m-frame .32s steps(1,end) infinite;animation-delay:-.16s}
@keyframes m-run-th{0%{transform:rotate(-25deg)}25%{transform:rotate(0deg)}50%{transform:rotate(30deg)}65%{transform:rotate(12deg)}80%{transform:rotate(-45deg)}100%{transform:rotate(-25deg)}}
@keyframes m-run-sh{0%{transform:rotate(10deg)}25%{transform:rotate(25deg)}50%{transform:rotate(15deg)}65%{transform:rotate(100deg)}80%{transform:rotate(85deg)}100%{transform:rotate(10deg)}}
@keyframes m-run-ua{0%,100%{transform:rotate(45deg)}50%{transform:rotate(-50deg)}}
@keyframes m-run-fa{0%,100%{transform:rotate(-60deg)}50%{transform:rotate(-110deg)}}
@keyframes m-run-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.m-run-th-a{animation:m-run-th .62s linear infinite}
.m-run-th-b{animation:m-run-th .62s linear infinite;animation-delay:-.31s}
.m-run-sh-a{animation:m-run-sh .62s linear infinite}
.m-run-sh-b{animation:m-run-sh .62s linear infinite;animation-delay:-.31s}
.m-run-ua-a{animation:m-run-ua .62s ease-in-out infinite}
.m-run-ua-b{animation:m-run-ua .62s ease-in-out infinite;animation-delay:-.31s}
.m-run-fa-a{animation:m-run-fa .62s ease-in-out infinite}
.m-run-fa-b{animation:m-run-fa .62s ease-in-out infinite;animation-delay:-.31s}
.m-run-bob{animation:m-run-bob .31s ease-in-out infinite;animation-delay:-.155s}
@keyframes m-air-on{0%,40.9%{opacity:0}41%,68.9%{opacity:1}69%,100%{opacity:0}}
@keyframes m-air-off{0%,40.9%{opacity:1}41%,68.9%{opacity:0}69%,100%{opacity:1}}
.m-air-on{opacity:0;animation:m-air-on 3.2s linear infinite}
.m-air-off{animation:m-air-off 3.2s linear infinite}
@media (prefers-reduced-motion:reduce){
.m-fb{opacity:0 !important}
*,*::before,*::after{animation:none !important;transition:none !important}
.m-draw{stroke-dashoffset:0}
}
</style>

             test: function (v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v.trim()); } }
  };
  var keys = ['name', 'age', 'phone', 'email'];
  var touched = {}, submitted = false, busy = false;
  var form = $('#da-form'), cta = $('#da-cta'), sub = $('#da-cta-sub'), ring = $('#da-ring');
  var CIRC = 138.23;

  function render() {
    var count = 0;
    keys.forEach(function (k) {
      var f = fields[k], el = f.el, box = el.closest('.field');
      var v = el.value, ok = f.test(v), focused = document.activeElement === el;
      var err = !ok && !focused && !!(submitted || touched[k]);
      if (ok) count++;
      box.classList.toggle('is-focus', focused);
      box.classList.toggle('is-ok', ok);
      box.classList.toggle('is-err', err);
      box.classList.toggle('is-up', !!(focused || v.length > 0 || err));
      box.querySelector('label').textContent = err ? f.msg : f.label;
      el.setAttribute('aria-invalid', err ? 'true' : 'false');
    });
    var left = 4 - count;
    ring.style.strokeDashoffset = (CIRC * (1 - count / 4)).toFixed(2);
    cta.classList.toggle('is-ready', count === 4);
    sub.textContent = count === 4 ? 'Tap to reveal your code' : left + (left === 1 ? ' detail' : ' details') + ' to go';
    return count === 4;
  }

  /* Digits only, max 10. A pasted +91 / 91 / leading 0 is stripped first. */
  function formatPhone(x) {
    var d = x.replace(/\D/g, '');
    if (d.length > 10 && d.indexOf('91') === 0) d = d.slice(2);
    if (d.length > 10 && d.charAt(0) === '0') d = d.slice(1);
    return d.slice(0, 10);
  }

  /* Hard stop at 10 digits while typing (paste is cleaned in formatPhone) */
  fields.phone.el.addEventListener('beforeinput', function (e) {
    if (e.inputType !== 'insertText' || !e.data) return;
    var el = e.target, selected = el.selectionEnd - el.selectionStart;
    if (/\D/.test(e.data)) { e.preventDefault(); return; }
    if (el.value.replace(/\D/g, '').length - selected >= 10) e.preventDefault();
  });

  keys.forEach(function (k) {
    var el = fields[k].el;
    el.addEventListener('input', function () {
      if (k === 'phone') { var f = formatPhone(el.value); if (f !== el.value) el.value = f; }
      if (k === 'age') { var a = el.value.replace(/\D/g, '').slice(0, 2); if (a !== el.value) el.value = a; }
      render();
    });
    el.addEventListener('focus', render);
    el.addEventListener('blur', function () { touched[k] = true; render(); });
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy) return;
    submitted = true;
    if (!render()) {
      var first = keys.filter(function (k) { return !fields[k].test(fields[k].el.value); })[0];
      fields[first].el.focus();
      $('#da-live').textContent = fields[first].msg;
      return;
    }
    busy = true; cta.setAttribute('aria-busy', 'true');
    var digits = fields.phone.el.value.replace(/\D/g, '');
    var data = {
      name: fields.name.el.value.trim(),
      age: parseInt(fields.age.el.value, 10),
      phone: '+91' + digits,
      email: fields.email.el.value.trim(),
      whatsappOptIn: $('#da-optin').checked,
      source: 'devils-circuit'
    };
    try {
      var res = await submitLead(data);
      showDone(data, res.code, res.repeat);
    } catch (err) {
      var msg = (err && err.message) || 'Something went wrong. Try again.';
      $('#da-live').textContent = msg;
      sub.textContent = msg;
    } finally {
      busy = false; cta.removeAttribute('aria-busy');
    }
  });

  function showDone(data, code, repeat) {
    $('#da-first').textContent = data.name.split(/\s+/)[0] || 'there';
    $('#da-code').textContent = code;
    $('#da-done-lede').textContent = repeat
      ? 'You’re already registered. Here’s your code again. Copy it and use it at checkout.'
      : 'Here’s your code. Copy it and use it at checkout.';
    $('#da-shop').href = shopLink(code);
    $('#da-form-screen').hidden = true;
    $('#da-done-screen').hidden = false;
    $('#da-done-title').focus({ preventScroll: true });
  }

  var copyBtn = $('#da-copy'), copyTimer;
  copyBtn.addEventListener('click', function () {
    var code = $('#da-code').textContent;
    var done = function () {
      copyBtn.classList.add('is-copied'); $('#da-copy-label').textContent = 'Copied';
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () { copyBtn.classList.remove('is-copied'); $('#da-copy-label').textContent = 'Copy'; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, done);
    } else {
      var t = document.createElement('textarea'); t.value = code; document.body.appendChild(t);
      t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); done();
    }
  });

  render();
})();
</script>
</body>
</html>
